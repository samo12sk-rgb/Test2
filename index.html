<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kalkulačka">
  <title>Moja Kalkulačka</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 20px;
    }
    .calculator { width: 100%; max-width: 400px; padding: 20px; }
    .display {
      color: #fff;
      font-size: 4rem;
      text-align: right;
      padding: 20px 10px;
      word-wrap: break-word;
      word-break: break-all;
    }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    button {
      border: none;
      outline: none;
      height: 75px;
      border-radius: 50%;
      font-size: 1.8rem;
      color: #fff;
      background-color: #333;
      cursor: pointer;
      transition: opacity 0.1s;
    }
    button:active { opacity: 0.7; }
    button.gray { background-color: #a5a5a5; color: #000; }
    button.orange { background-color: #ff9f0a; }
    button.zero { grid-column: span 2; border-radius: 40px; text-align: left; padding-left: 30px; }
  </style>
</head>
<body>

<div class="calculator">
  <div class="display" id="display">0</div>
  <div class="buttons">
    <button class="gray" onclick="clearDisplay()">AC</button>
    <button class="gray" onclick="toggleSign()">+/-</button>
    <button class="gray" onclick="appendOperator('%')">%</button>
    <button class="orange" onclick="appendOperator('/')">÷</button>
    
    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button class="orange" onclick="appendOperator('*')">×</button>
    
    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button class="orange" onclick="appendOperator('-')">-</button>
    
    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button class="orange" onclick="appendOperator('+')">+</button>
    
    <button class="zero" onclick="appendNumber('0')">0</button>
    <button onclick="appendNumber('.')">,</button>
    <button class="orange" onclick="calculate()">=</button>
  </div>
</div>

<script>
  let display = document.getElementById('display');
  let currentInput = '0';
  let shouldReset = false;

  function updateDisplay() {
    display.innerText = currentInput;
  }

  function appendNumber(num) {
    if (currentInput === '0' || shouldReset) {
      currentInput = num === '.' ? '0.' : num;
      shouldReset = false;
    } else {
      if (num === '.' && currentInput.includes('.')) return;
      currentInput += num;
    }
    updateDisplay();
  }

  function appendOperator(op) {
    const lastChar = currentInput.slice(-1);
    if (['+', '-', '*', '/', '%'].includes(lastChar)) {
      currentInput = currentInput.slice(0, -1) + op;
    } else {
      currentInput += op;
    }
    shouldReset = false;
    updateDisplay();
  }

  function clearDisplay() {
    currentInput = '0';
    updateDisplay();
  }

  function toggleSign() {
    if (currentInput !== '0') {
      currentInput = currentInput.startsWith('-') ? currentInput.slice(1) : '-' + currentInput;
      updateDisplay();
    }
  }

  function calculate() {
    try {
      currentInput = String(eval(currentInput.replace(/×/g, '*').replace(/÷/g, '/')));
      shouldReset = true;
    } catch {
      currentInput = 'Chyba';
      shouldReset = true;
    }
    updateDisplay();
  }
</script>

</body>
</html>
